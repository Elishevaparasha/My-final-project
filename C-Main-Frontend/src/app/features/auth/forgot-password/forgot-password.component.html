<div class="auth-card">
  <h1>איפוס סיסמה</h1>
  <p class="hint">הזיני את האימייל, טוקן האיפוס מהמייל, וסיסמה חדשה.</p>
  <form [formGroup]="form" (ngSubmit)="submit()">
    <label>
      אימייל
      <input type="email" formControlName="email" />
    </label>
    <label>
      טוקן איפוס
      <input type="text" formControlName="resetToken" />
    </label>
    <label>
      סיסמה חדשה
      <input type="password" formControlName="newPassword" />
    </label>
    @if (error()) {
      <p class="error">{{ error() }}</p>
    }
    @if (success()) {
      <p class="success">{{ success() }}</p>
    }
    <button type="submit" class="btn btn-primary" [disabled]="loading()">שמירה</button>
  </form>
  <p class="links"><a routerLink="/login">חזרה להתחברות</a></p>
</div>
