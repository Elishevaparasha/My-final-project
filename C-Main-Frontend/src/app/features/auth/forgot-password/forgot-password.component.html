<div class="auth-card">
  <h1>איפוס סיסמה</h1>

  @if (!email()) {
    <p class="error">{{ error() }}</p>
    <p class="links"><a routerLink="/login">חזרה להתחברות</a></p>
  } @else if (!codeSent() && sending()) {
    <p class="hint">שולחים קוד למייל {{ email() }}...</p>
  } @else {
    <p class="hint">נשלח קוד למייל <strong>{{ email() }}</strong>. הזיני אותו ואת הסיסמה החדשה.</p>

    @if (success()) {
      <p class="success">{{ success() }}</p>
    }
    @if (error()) {
      <p class="error">{{ error() }}</p>
    }

    <form [formGroup]="form" (ngSubmit)="submit()">
      <label>
        הקוד מהמייל
        <input type="text" formControlName="resetToken" inputmode="numeric" autocomplete="one-time-code" />
        @if (form.controls.resetToken.invalid && form.controls.resetToken.touched) {
          <span class="field-error">שדה חובה</span>
        }
      </label>
      <label>
        סיסמה חדשה (לפחות 6 תווים)
        <input type="password" formControlName="newPassword" autocomplete="new-password" />
        @if (form.controls.newPassword.invalid && form.controls.newPassword.touched) {
          <span class="field-error">סיסמה חייבת להכיל לפחות 6 תווים</span>
        }
      </label>
      <button type="submit" class="btn btn-primary" [disabled]="loading()">
        {{ loading() ? 'שומר...' : 'שמירת סיסמה חדשה' }}
      </button>
    </form>

    <button
      type="button"
      class="btn btn-primary"
      style="margin-top: 0.75rem"
      [disabled]="sending()"
      (click)="resend()"
    >
      {{ sending() ? 'שולח שוב...' : 'לא קיבלתי — שלחו שוב' }}
    </button>

    <p class="links"><a routerLink="/login">חזרה להתחברות</a></p>
  }
</div>
