<div class="auth-card">
  <h1>הרשמה</h1>
  <form [formGroup]="form" (ngSubmit)="submit()">
    <label>
      שם משתמש
      <input type="text" formControlName="userName" />
      @if (form.controls.userName.invalid && form.controls.userName.touched) {
        <span class="field-error">שדה חובה</span>
      }
    </label>
    <label>
      שם פרטי
      <input type="text" formControlName="firstName" />
      @if (form.controls.firstName.invalid && form.controls.firstName.touched) {
        <span class="field-error">שדה חובה</span>
      }
    </label>
    <label>
      שם משפחה
      <input type="text" formControlName="lastName" />
      @if (form.controls.lastName.invalid && form.controls.lastName.touched) {
        <span class="field-error">שדה חובה</span>
      }
    </label>
    <label>
      אימייל
      <input type="email" formControlName="email" />
      @if (form.controls.email.invalid && form.controls.email.touched) {
        <span class="field-error">נא להזין אימייל תקין</span>
      }
    </label>
    <label>
      סיסמה (לפחות 6 תווים)
      <input type="password" formControlName="password" />
      @if (form.controls.password.invalid && form.controls.password.touched) {
        <span class="field-error">סיסמה חייבת להכיל לפחות 6 תווים</span>
      }
    </label>
    @if (error()) {
      <p class="error">{{ error() }}</p>
    }
    @if (success()) {
      <p class="success">{{ success() }}</p>
    }
    <button type="submit" class="btn btn-primary" [disabled]="loading()">
      {{ loading() ? 'נרשם...' : 'הירשם' }}
    </button>
  </form>
  <p class="links"><a routerLink="/login">כבר יש חשבון? התחברות</a></p>
</div>
